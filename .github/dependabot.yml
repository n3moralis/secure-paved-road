version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: ["/platforms/gke/terraform/foundation", "/platforms/gke/terraform/platform"]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "hashicorp/google"
        update-types: ["version-update:semver-major"]
